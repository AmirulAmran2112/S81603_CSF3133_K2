<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors Game</title>
    <!-- Link external CSS stylesheet -->
    <link rel="stylesheet" href="lab6_ExerA.css">
</head>
<body>

    <!-- Header with game title and short instruction -->
    <header>
        <h1>Rock, Paper, Scissors</h1>
        <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
    </header>

    <main>
        <!-- Player section with Name input and Start Game button -->
        <section class="player-section">
            <label for="playerName">Your name:</label>
            <input type="text" id="playerName" placeholder="Enter name">
            <button onclick="startGame()">Start Game</button>
        </section>

        <!-- Game section with choices, image display, and scoreboard -->
        <section class="game-section">
            <div class="choices">
                <button onclick="playRound('rock')">Rock</button>
                <button onclick="playRound('paper')">Paper</button>
                <button onclick="playRound('scissors')">Scissors</button>
            </div>

            <div class="battle-area">
                <div class="player-side">
                    <p>You</p>
                    <img id="playerImg" src="rock.png" alt="Player Choice">
                </div>
                <div class="vs">VS</div>
                <div class="computer-side">
                    <p>Computer</p>
                    <img id="computerImg" src="rock.png" alt="Computer Choice">
                </div>
            </div>

            <p id="result"></p>
            
            <div class="scoreboard">
                Wins: <span id="wins">0</span> | 
                Losses: <span id="losses">0</span> | 
                Draws: <span id="draws">0</span>
            </div>
        </section>

        <!-- History section with history table, summary, and reset buttons -->
        <section class="history-section">
            <h2>History</h2>
            <table id="history">
                <tr>
                    <th>Round</th>
                    <th>You</th>
                    <th>Computer</th>
                    <th>Result</th>
                </tr>
            </table>
            <div class="action-buttons">
                <button onclick="showSummary()">Show Summary</button>
                <button onclick="resetGame()">Reset</button>
            </div>
        </section>
    </main>

    <!-- Footer displaying start time and copyright -->
    <footer>
        <p id="startTime"></p>
        <p>&copy; 2026 Computer Science Club</p>
    </footer>

    <!-- Link external JavaScript file before body end -->
    <script src="game.js"></script>
</body>
</html>
